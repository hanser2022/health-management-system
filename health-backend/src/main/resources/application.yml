spring:
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${AI_API_KEY:YOUR_AI_API_KEY_HERE}
      chat:
        options:
          model: qwen-plus

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db_health?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_DB_PASSWORD_HERE
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.shanzhu: debug

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.shanzhu.*.entity

health:
  ai:
    enabled: ${AI_ENABLED:true}
